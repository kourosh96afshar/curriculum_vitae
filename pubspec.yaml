name: curriculum_vitae
description: "A new Flutter project."


publish_to: 'none' 



version: 1.0.0+1

environment:
  sdk: ^3.13.1



dependencies:
  flutter:
    sdk: flutter

  
  
  cupertino_icons: ^1.0.8

  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  
  flutter_lints: ^6.0.0


flutter:

  generate: true

  
  uses-material-design: true

  
  assets:
    - assets/images/
  

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          style: italic
          weight: 700
  
  
  
